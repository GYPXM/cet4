  for(var i=0;i<PLAN.length;i++){

    for(var j=0;j<p.tasks.length;j++){ t2++; if(d[j]) a2++; }
  }
  return {a:a2, t:t2};
}
function streak(){
  var day = dayNum(), n = 0, p = PLAN[day-1], done = store.get('ck-'+day, {});
  var todayAll = true;
  for(var i=0;i<p.tasks.length;i++){ if(!done[i]){ todayAll = false; break; } }
  if(todayAll) n = 1;
  for(var d = day-1; d >= 1; d--){
    var pd = PLAN[d-1], dd = store.get('ck-'+d, {}), all = true;
    for(var j=0;j<pd.tasks.length;j++){ if(!dd[j]){ all = false; break; } }
    if(all) n++; else break;
  }
  return n;
}

function stats(){ return store.get('wstats', {}); }

var __audio = null;
function tts(t){
  try{
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speak(text, isWord, el){
  var t = String(text || '').trim();
  if(!t) return;
  var mark2 = function(ch){
    if(!el) return;
    el.textContent = ch;
    setTimeout(function(){ try{ el.textContent = '\uD83D\uDD0A'; }catch(e){} }, 1600);
  };
  if(!isWord){ tts(t); mark2('\uD83D\uDD09'); return; }
  try{
    if(__audio){ try{ __audio.pause(); }catch(e){} __audio.src = ''; __audio = null; }
    var url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(t) + '&type=2';
    __audio = new Audio();
    __audio.preload = 'auto';
    __audio.volume = 1;
    __audio.src = url;
    var p = __audio.play();
    if(p && p.then){
      p.then(function(){ mark2('\uD83D\uDD09'); })
       .catch(function(){ mark2('\uD83D\uDD07'); tts(t); });
    } else { mark2('\uD83D\uDD09'); }
  }catch(e){ mark2('\uD83D\uDD07'); tts(t); }
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function poolUnmarked(){
  var s2 = stats(), pool = [];
  for(var i=0;i<WORDS.length;i++){ if(!s2[WORDS[i].w]) pool.push(i); }
  if(!pool.length){ for(var k=0;k<WORDS.length;k++) pool.push(k); }
  return pool;
}

  var q = store.get('queue', null);
  if(q && q.pos < q.list.length){ wq = q; flipped = false; render(); window.scrollTo(0,0); return; }
  var pool = shuffle(poolUnmarked());
  var list = pool.slice(0, Math.min(40, pool.length));
  q = {list:list, pos:0, mode:'new', known:0, unsure:0, unknown:0};
  store.set('queue', q);
  wq = q; flipped = false;
  render(); window.scrollTo(0,0);
}

function mark(lv){
  if(!wq) return;
  var w = WORDS[wq.list[wq.pos]].w;
  var s2 = stats(); s2[w] = lv; store.set('wstats', s2);
  if(lv === 1) wq.known++; else if(lv === 2) wq.unsure++; else wq.unknown++;
  wq.pos++;
  store.set(wq.mode === 'review' || wq.mode === 'hard' ? 'rqueue' : 'queue', wq);
  flipped = false;

      '<div class="tip">「学新词」每组 40 个随机词；「复习已学」从学过里面随机抽 20 个考你，忘了的自动回顽固本。</div>' +
      '<button class="btn ok" onclick="startWords()">' + (restNew ? '继续学新词（还剩 ' + restNew + ' 个）' : '学新词 40 个') + '</button>' +
      '<button class="btn" style="background:#182238;color:#9db4e6;border:1px solid #24365c" onclick="reviewLearned()">' + (restRev ? '继续复习（还剩 ' + restRev + ' 个）' : '复习已学 20 个') + '</button>' +
      '<button class="btn ghost sm" onclick="resetWords()">' + (resetArm ? '⚠ 再点一次，确认清除全部背词记录' : '从头开始刷') + '</button></div>';
  }

  if(wq && wq.pos < wq.list.length){
    if(reviewEmpty){ h += '<div class="tip" style="color:#fbbf24">你还没学过任何词，先去背新词吧</div>'; }
    return h + wordCard();
  }

  if(wq && wq.pos >= wq.list.length){
    h += '<div class="card done-big"><div class="em">' + (wq.mode === 'new' ? '🎉' : '💪') + '</div>' +
      '<h3>' + (wq.mode === 'new' ? '这一组新词背完了' : (wq.mode === 'review' ? '这轮复习做完了' : '顽固本过完了')) + '</h3>' +
      '<div style="font-size:14px;color:#a7b1c4;margin-top:8px">' +
      '记得/认识 ' + wq.known + ' · 模糊 ' + wq.unsure + ' · 忘了/不认识 ' + wq.unknown + '</div>' +
      '<button class="btn ok" onclick="wq=null;render()">回到单词首页</button></div>';
    return h;
  }

  if(reviewEmpty){ h += '<div class="tip" style="color:#fbbf24">顽固本还是空的，先背几个词吧</div>'; }

  h += '<div class="card">' +
    '<div class="row"><b>顽固本</b><span style="font-size:12px;color:#f87171">' + hard.length + ' 词</span></div>' +
    '<div class="tip">标记「模糊」「不认识」「忘了」的词会进这里。每天睡前翻一遍，三遍还记不住就抄纸上随身带。</div>' +
    (hard.length ? '<button class="btn ghost sm" onclick="reviewHard()">复习顽固本（' + hard.length + ' 词）</button>' : '');
  if(hard.length){
    h += '<div style="margin-top:10px">';
    hard.forEach(function(k){
      var f = null;
      for(var i=0;i<WORDS.length;i++){ if(WORDS[i].w === k){ f = WORDS[i]; break; } }
      h += '<div class="hist"><span><b>' + esc(k) + '</b> ' + esc(f ? f.m : '') +
        '</span><span style="color:#8b95a7">' + (s2[k] === 3 ? '不认识' : '模糊') + '</span></div>';
    });
    h += '</div>';
  } else { h += '<div class="empty">还没有顽固词，开始背词就有了</div>'; }
  h += '</div>';
  h += '<div class="card"><div class="row"><b>已掌握</b>' +
    '<span style="font-size:12px;color:#34d399">' + knownN + ' 词</span></div></div>';
  return h;
}

/* ---------- 成绩 ---------- */
function viewScore(){
  var mocks = store.get('mocks', []);
  var h = '';
  var last = mocks.length ? mocks[mocks.length-1] : null;
  h += '<div class="card">'+
    '<div style="text-align:center;font-size:12px;color:#8b95a7">最近一次估算总分</div>'+
    '<div class="total">'+(last? (last.L+last.R+last.W+last.T) : '--')+'<small> / 710</small></div>'+
    '<div class="tip" style="text-align:center">425 分过线。听力+阅读占 70%，这两项加起来不到 300 很危险。</div>'+
  '</div>';
  h += '<div class="card"><b style="font-size:15px">录入一次模考成绩</b>'+
    '<div class="tip" style="margin-bottom:12px">按官方换算后的分数填（听力/阅读满分各 249，写作/翻译各 106）。不知道就按比例估。</div>'+
    '<div class="grid2">'+
      '<div><label class="sm">听力 /249</label><input type="number" id="sL" placeholder="0" inputmode="numeric"></div>'+
      '<div><label class="sm">阅读 /249</label><input type="number" id="sR" placeholder="0" inputmode="numeric"></div>'+
      '<div><label class="sm">写作 /106</label><input type="number" id="sW" placeholder="0" inputmode="numeric"></div>'+
      '<div><label class="sm">翻译 /106</label><input type="number" id="sT" placeholder="0" inputmode="numeric"></div>'+
    '</div>'+
    '<button class="btn" onclick="saveMock()">保存这次成绩</button></div>';
  if(mocks.length){
    h += '<div class="card"><div class="row"><b>历史记录</b>'+
      '<span style="font-size:12px;color:#8b95a7">'+mocks.length+' 次</span></div>';
    mocks.forEach(function(m,i){
      var tot = m.L+m.R+m.W+m.T;
      var col = tot>=425 ? '#34d399' : (tot>=380?'#fbbf24':'#f87171');
      h += '<div class="hist"><span>第'+(i+1)+'次（'+m.date+'）</span>'+
        '<span>听'+m.L+' 读'+m.R+' 写'+m.W+' 译'+m.T+'　'+
        '<b style="color:'+col+'">'+tot+'</b></span></div>';
    });
    h += '<button class="btn ghost sm" onclick="delMock()">删除最后一条</button></div>';
  }
  return h;
}
function saveMock(){
  var g = function(id){ return Math.max(0, parseInt(document.getElementById(id).value||'0',10)||0); };
  var m = {date:(new Date().getMonth()+1)+'/'+new Date().getDate(),
           L:g('sL'), R:g('sR'), W:g('sW'), T:g('sT')};
  if(!m.L && !m.R && !m.W && !m.T){ alert('先填至少一项分数'); return; }
  var arr = store.get('mocks', []); arr.push(m); store.set('mocks', arr);
  render(); window.scrollTo(0,0);
}
function delMock(){ var a = store.get('mocks', []); a.pop(); store.set('mocks', a); render(); }

/* ---------- 计划 ---------- */
function viewPlan(){
  var d = dayNum(), h = '';
  h += '<div class="sec-t">21 天全程（点击展开任务）</div>';
  PLAN.forEach(function(p){
    var open = p.d === d;
    h += '<div class="plan-day'+(p.d===d?' today':'')+'">'+
      '<div class="ph" onclick="this.nextElementSibling.classList.toggle(\'show\')">'+
      '<span><b>Day '+p.d+'</b>　'+p.date+' · '+esc(p.t)+'</span>'+
      '<span>'+(p.d===d?'今天':p.tasks.length+' 项')+'</span></div>'+
      '<div class="pb'+(open?' show':'')+'">'+
      p.tasks.map(function(t){ return '<div>'+esc(t[0])+'　<span style="color:#6b7689">'+t[1]+'分</span></div>'; }).join('')+
      '</div></div>';
  });
  h += '<div class="card" style="margin-top:14px"><b style="font-size:15px">三条铁律</b>'+
    '<div class="tip">1. 不换材料：全程只用真题，不买模拟题、不换单词书。<br>'+
    '2. 单词只认不写：除了写作那 100 个替换词，其它词看到能认就行。<br>'+
    '3. 每天必须动笔：听力和阅读都要限时做，手感比知识重要。</div></div>';
  h += '<div class="card" style="margin-top:14px"><b style="font-size:15px">数据备份</b>'+
    '<div class="tip">换浏览器或换手机时，用这里把进度搬过去。导出后长按文本框全选复制。</div>'+
    '<textarea id="bak" style="width:100%;height:86px;margin-top:10px;background:#0f131b;color:#a7b1c4;border:1px solid #2a3346;border-radius:10px;padding:10px;font-size:11px;font-family:monospace;resize:none"></textarea>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'+
    '<button class="btn ghost sm" style="margin:0;grid-column:1/-1" onclick="uploadLocal()">发送到本机（仅本地预览）</button>'+
    '<button class="btn ghost sm" style="margin:0" onclick="exportData()">导出到上面</button>'+
    '<button class="btn ghost sm" style="margin:0" onclick="importData()">从上面导入</button></div></div>';
  if(dumpChunks){
    h += '<div class="card" style="font-size:12px;font-family:monospace;word-break:break-all;line-height:1.7">';
    dumpChunks.forEach(function(c){ h += '<div>' + esc(c) + '</div>'; });
    h += '</div>';
  }
  h += '<button class="btn ghost" onclick="resetAll()">清空所有记录</button>';
  return h;
}
function resetAll(){
  if(!confirm('确定清空全部打卡、单词和成绩记录？此操作不可撤销。')) return;
  ['wstats','wordIdx','mocks','queue'].forEach(function(k){
    if(hasLS) localStorage.removeItem(k); delete mem[k];
  });
  for(var i=1;i<=22;i++){ if(hasLS) localStorage.removeItem('ck-'+i); delete mem['ck-'+i]; }
  wq = null; render();
}

/* ---------- 数据备份 ---------- */
function exportData(){
  var d = {wstats:store.get('wstats',{}), wordIdx:store.get('wordIdx',0),
           mocks:store.get('mocks',[]), ck:{}};
  for(var i=1;i<=22;i++){ var v = store.get('ck-'+i, null); if(v) d.ck[i] = v; }
  var s = JSON.stringify(d);
  var el = document.getElementById('bak');
  el.value = s;
  el.focus(); el.select();
  var copied = false;
  try{ copied = document.execCommand('copy'); }catch(e){}
  if(!copied){ try{ navigator.clipboard.writeText(s); copied = true; }catch(e){} }
  alert(copied ? '已导出并复制到剪贴板' : '已导出' + (hasLS ? '' : '（当前存储不可用）'));
}
function importData(){
  var el = document.getElementById('bak');
  var s = el.value.trim();
  if(!s){ alert('先把备份内容粘贴到上面的框里'); return; }
  var d;
  try{ d = JSON.parse(s); }catch(e){ alert('格式不对，请完整复制整段文本'); return; }
  if(!confirm('导入会覆盖当前所有记录，确定吗？')) return;
  if(d.wstats) store.set('wstats', d.wstats);
  if(typeof d.wordIdx === 'number') store.set('wordIdx', d.wordIdx);
  if(d.mocks) store.set('mocks', d.mocks);
  if(d.ck){ for(var k in d.ck){ store.set('ck-'+k, d.ck[k]); } }
  wq = null;
  alert('导入完成');
  render();
}

/* ---------- 倒计时 ---------- */
function pad(n){ return n<10?'0'+n:''+n; }
function tickClock(){
  var el = document.getElementById('clk');
  if(!el) return;
  var ms = EXAM - Date.now();
  if(ms < 0) ms = 0;
  var s = Math.floor(ms/1000);
  var D = Math.floor(s/86400), H = Math.floor(s%86400/3600),
      M = Math.floor(s%3600/60), S = s%60;
  el.textContent = D+' 天 '+pad(H)+':'+pad(M)+':'+pad(S);
}

var dumpChunks = null;
function uploadLocal(){
  var d = {wstats:store.get('wstats',{}), mocks:store.get('mocks',[]), ck:{}};
  for(var i=1;i<=22;i++){ var v = store.get('ck-'+i, null); if(v) d.ck[i]=v; }
  var str = JSON.stringify(d);
  try{ fetch('http://127.0.0.1:8899/save?d=' + encodeURIComponent(str)).catch(function(){}); }catch(e){}
  dumpChunks = [];
  for(var j=0;j<str.length;j+=60) dumpChunks.push(str.substr(j,60));
  render();
  window.scrollTo(0, document.body.scrollHeight);
}
function importPayload(d, merge){
  if(!d) return 0;
  var n = 0;
  if(d.wstats){
    var cur = stats(), k;
    for(k in d.wstats){
      if(!merge || !cur[k] || d.wstats[k] < cur[k]){ cur[k] = d.wstats[k]; n++; }
    }
    store.set('wstats', cur);
  }
  if(d.ck){
    for(var dk in d.ck){
      var cur2 = store.get('ck-' + dk, {});
      for(var i in d.ck[dk]){ if(d.ck[dk][i]){ cur2[i] = 1; n++; } }
      store.set('ck-' + dk, cur2);
    }
  }
  if(d.mocks && d.mocks.length){
    var cur3 = store.get('mocks', []);
    for(var j=0;j<d.mocks.length;j++){ cur3.push(d.mocks[j]); n++; }
    store.set('mocks', cur3);
  }
  return n;
}
function applyHashImport(){
  var m = location.hash.match(/^#imp=(.+)$/);
  if(!m) return;
  var d = null;
  try{ d = JSON.parse(decodeURIComponent(m[1])); }catch(e){ return; }
  importPayload(d, true);
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  hashImported = true;
}
var hashImported = false;

render();
setInterval(function(){ if(tab==='today') tickClock(); }, 1000);
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
setTimeout(function(){ try{ applyHashImport(); if(hashImported) render(); }catch(e){} }, 30);
</script>
